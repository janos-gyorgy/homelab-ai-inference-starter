# Ingress examples for Open WebUI.
# Uncomment the block that matches your ingress controller.

# ── Option A: Traefik IngressRoute ────────────────────────────────────────────
# Suitable for k3s (Traefik is the default ingress controller).
# Replace ai.example.com with your hostname.
# Remove the middlewares block if you don't use an auth proxy.

# apiVersion: traefik.io/v1alpha1
# kind: IngressRoute
# metadata:
#   name: open-webui
#   namespace: ai-inference
# spec:
#   entryPoints:
#     - websecure   # HTTPS
#   routes:
#     - match: Host(`ai.example.com`)
#       kind: Rule
#       # Optional: attach an OAuth2 proxy middleware for authentication
#       # middlewares:
#       #   - name: oauth-auth
#       #     namespace: your-auth-namespace
#       services:
#         - name: open-webui
#           port: 80
#   tls:
#     secretName: your-tls-secret   # or use a default cert on the entrypoint

# ── Option B: nginx Ingress ───────────────────────────────────────────────────

# apiVersion: networking.k8s.io/v1
# kind: Ingress
# metadata:
#   name: open-webui
#   namespace: ai-inference
#   annotations:
#     nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
#     nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
# spec:
#   ingressClassName: nginx
#   rules:
#     - host: ai.example.com
#       http:
#         paths:
#           - path: /
#             pathType: Prefix
#             backend:
#               service:
#                 name: open-webui
#                 port:
#                   number: 80
#   tls:
#     - hosts:
#         - ai.example.com
#       secretName: your-tls-secret

# ── Option C: NodePort (no ingress controller needed) ────────────────────────
# Exposes Open WebUI directly on a node port.

# apiVersion: v1
# kind: Service
# metadata:
#   name: open-webui-nodeport
#   namespace: ai-inference
# spec:
#   type: NodePort
#   selector:
#     app: open-webui
#   ports:
#     - port: 80
#       targetPort: 8080
#       nodePort: 30080   # access at http://<node-ip>:30080
