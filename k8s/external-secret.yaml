# External Secrets Operator alternative for the Open WebUI secret key.
# Requires ESO + a ClusterSecretStore named "vault" backed by HashiCorp Vault.
# See: https://external-secrets.io
#
# Seed Vault first:
#   vault kv put secret/ai-inference secret-key="$(openssl rand -hex 32)"
#
# Then apply this file instead of creating the Secret manually.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-secret
  namespace: ai-inference
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: open-webui-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: secret-key
      remoteRef:
        key: secret/ai-inference
        property: secret-key
