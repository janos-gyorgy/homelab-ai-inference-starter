# Secret for Open WebUI session signing key.
#
# Option A — plain kubectl (simplest):
#
#   kubectl create secret generic open-webui-secrets \
#     --namespace ai-inference \
#     --from-literal=secret-key="$(openssl rand -hex 32)"
#
# Option B — declarative YAML (do NOT commit the real value):
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: open-webui-secrets
#   namespace: ai-inference
# stringData:
#   secret-key: "REPLACE_WITH_RANDOM_HEX"
#
# Option C — External Secrets Operator with Vault:
#
#   vault kv put secret/ai-inference secret-key="$(openssl rand -hex 32)"
#
# Then apply external-secret.yaml (see k8s/external-secret.yaml).
